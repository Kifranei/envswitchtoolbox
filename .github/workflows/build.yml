name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  winui:
    name: 2.0.0 (WinUI 3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish (Release, x64, self-contained single file)
        run: dotnet publish src/EnvSwitchToolbox.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: EnvSwitchToolbox-2.0.0-win-x64
          path: out/EnvSwitchToolbox.exe

  legacy:
    name: 1.0.0 (WinForms, legacy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build (Release)
        run: dotnet build legacy/winforms/EnvSwitchToolbox.csproj -c Release -o out-legacy
      - uses: actions/upload-artifact@v4
        with:
          name: EnvSwitchToolbox-1.0.0-winforms
          path: out-legacy/EnvSwitchToolbox.exe
